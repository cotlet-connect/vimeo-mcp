[project]
name = "vimeo-mcp"
version = "1.1.0"
description = "Connect Vimeo to ChatGPT, Claude, Codex and Claude Code and any AI agent through Cotlet.dev, a hosted MCP server. No Vimeo API key needed."
readme = "README.md"
license = "Elastic-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Cotlet.dev", email = "contact@cotlet.dev" }]
keywords = ["vimeo", "vimeo api", "vimeo mcp", "mcp server", "claude", "chatgpt", "ai agent", "cotlet"]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Office/Business"]
dependencies = []

[project.urls]
Homepage = "https://cotlet.dev/integrations/vimeo-api-mcp-server?utm_source=pypi&utm_medium=package&utm_campaign=vimeo"
Source = "https://github.com/cotlet-connect/vimeo-mcp"

[project.scripts]
vimeo-mcp = "vimeo_agent:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.force-include]
"vimeo_agent.py" = "vimeo_agent.py"

[tool.hatch.build.targets.sdist]
include = ["vimeo_agent.py", "README.md", "LICENSE", "mcp.json", "Dockerfile", "glama.json", "skills", "examples", ".cursor"]
